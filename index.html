<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olivia's Volleyball Career</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #e0e7ff;
            color: var(--primary);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .counter button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #f9fafb;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter button:active {
            background: #e5e7eb;
        }

        .counter span {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
            text-align: center;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .save-btn:hover {
            background-color: #059669;
        }

        .history-card {
            border-left: 4px solid var(--primary);
            margin-bottom: 15px;
        }

        .history-header {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .history-sub {
            color: #6b7280;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            background: #f9fafb;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-action.edit:hover {
            background: #e0e7ff;
            color: var(--primary);
        }

        .btn-action.delete {
            color: var(--danger);
        }

        .btn-action.delete:hover {
            background: #fee2e2;
        }

        .empty-state {
            text-align: center;
            color: #9ca3af;
            padding: 40px 0;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Olivia's Volleyball Career</h1>

    <div class="nav-tabs">
        <button type="button" class="tab-btn active" onclick="switchTab('tracker', event)">Game Tracker</button>
        <button type="button" class="tab-btn" onclick="switchTab('history', event)">Saved History</button>
    </div>

    <!-- Tracker View -->
    <div id="tracker" class="tab-content active">
        <form id="trackerForm" onsubmit="saveGame(event)">
            <div class="card">
                <div class="form-group">
                    <label for="gameDate">Date & Time</label>
                    <input type="datetime-local" id="gameDate" required>
                </div>
                <div class="form-group">
                    <label for="gameLocation">Location / Opponent</label>
                    <input type="text" id="gameLocation" placeholder="e.g., Lincoln High Gymnasium" required>
                </div>
            </div>

            <div class="card">
                <h3>Game Stats</h3>
                <div class="stat-row">
                    <span>Good Serve</span>
                    <div class="counter">
                        <button type="button" onclick="updateStat('goodServe', -1)">-</button>
                        <span id="goodServe">0</span>
                        <button type="button" onclick="updateStat('goodServe', 1)">+</button>
                    </div>
                </div>
                <div class="stat-row">
                    <span>Points</span>
                    <div class="counter">
                        <button type="button" onclick="updateStat('points', -1)">-</button>
                        <span id="points">0</span>
                        <button type="button" onclick="updateStat('points', 1)">+</button>
                    </div>
                </div>
                <div class="stat-row">
                    <span>Assists</span>
                    <div class="counter">
                        <button type="button" onclick="updateStat('assists', -1)">-</button>
                        <span id="assists">0</span>
                        <button type="button" onclick="updateStat('assists', 1)">+</button>
                    </div>
                </div>
                <div class="stat-row">
                    <span>Good Try</span>
                    <div class="counter">
                        <button type="button" onclick="updateStat('goodTry', -1)">-</button>
                        <span id="goodTry">0</span>
                        <button type="button" onclick="updateStat('goodTry', 1)">+</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="save-btn">Save Game & Reset Tracker</button>
        </form>
    </div>

    <!-- History View -->
    <div id="history" class="tab-content">
        <div id="historyList"></div>
    </div>
</div>

<!-- Edit Game Modal -->
<div id="editModal" class="modal-overlay">
    <div class="modal">
        <h3>Edit Saved Game</h3>
        <form id="editForm" onsubmit="submitEdit(event)">
            <input type="hidden" id="editGameId">
            <div class="form-group">
                <label for="editDate">Date & Time</label>
                <input type="datetime-local" id="editDate" required>
            </div>
            <div class="form-group">
                <label for="editLocation">Location / Opponent</label>
                <input type="text" id="editLocation" required>
            </div>

            <div class="stat-row">
                <span>Good Serve</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('goodServe', -1)">-</button>
                    <span id="edit_goodServe">0</span>
                    <button type="button" onclick="updateEditStat('goodServe', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Points</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('points', -1)">-</button>
                    <span id="edit_points">0</span>
                    <button type="button" onclick="updateEditStat('points', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Assists</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('assists', -1)">-</button>
                    <span id="edit_assists">0</span>
                    <button type="button" onclick="updateEditStat('assists', 1)">+</button>
                </div>
            </div>
            <div class="stat-row">
                <span>Good Try</span>
                <div class="counter">
                    <button type="button" onclick="updateEditStat('goodTry', -1)">-</button>
                    <span id="edit_goodTry">0</span>
                    <button type="button" onclick="updateEditStat('goodTry', 1)">+</button>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button type="submit" class="save-btn" style="margin-top:0">Update Game</button>
            </div>
        </form>
    </div>
</div>

<script>
    let stats = { goodServe: 0, points: 0, assists: 0, goodTry: 0 };
    let editStats = { goodServe: 0, points: 0, assists: 0, goodTry: 0 };

    document.getElementById('gameDate').value = new Date().toISOString().slice(0, 16);

    function updateStat(statKey, change) {
        stats[statKey] = Math.max(0, stats[statKey] + change);
        document.getElementById(statKey).innerText = stats[statKey];
    }

    function updateEditStat(statKey, change) {
        editStats[statKey] = Math.max(0, editStats[statKey] + change);
        document.getElementById('edit_' + statKey).innerText = editStats[statKey];
    }

    function switchTab(tabName, evt) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
       
        document.getElementById(tabName).classList.add('active');
        if (evt) evt.currentTarget.classList.add('active');

        if (tabName === 'history') {
            renderHistory();
        }
    }

    function saveGame(event) {
        if (event) event.preventDefault();

        const location = document.getElementById('gameLocation').value.trim();
        const date = document.getElementById('gameDate').value;

        if (!location) return;

        const gameObject = {
            id: String(Date.now()),
            date: date,
            location: location,
            stats: { ...stats }
        };

        const existingGames = JSON.parse(localStorage.getItem('oliviaVolleyballGames') || '[]');
        existingGames.push(gameObject);
        localStorage.setItem('oliviaVolleyballGames', JSON.stringify(existingGames));

        stats = { goodServe: 0, points: 0, assists: 0, goodTry: 0 };
        Object.keys(stats).forEach(key => document.getElementById(key).innerText = 0);
        document.getElementById('gameLocation').value = '';
        document.getElementById('gameDate').value = new Date().toISOString().slice(0, 16);

        alert('Game saved successfully!');
    }

    function renderHistory() {
        const historyContainer = document.getElementById('historyList');
        const games = JSON.parse(localStorage.getItem('oliviaVolleyballGames') || '[]');

        if (games.length === 0) {
            historyContainer.innerHTML = '<div class="empty-state">No saved games found yet.</div>';
            return;
        }

        historyContainer.innerHTML = games.slice().reverse().map(game => {
            const formattedDate = new Date(game.date).toLocaleString([], {
                dateStyle: 'medium',
                timeStyle: 'short'
            });

            return `
                <div class="card history-card">
                    <div class="history-header">${game.location}</div>
                    <div class="history-sub">${formattedDate}</div>
                    <div class="history-stats">
                        <div><strong>Good Serves:</strong> ${game.stats.goodServe}</div>
                        <div><strong>Points:</strong> ${game.stats.points}</div>
                        <div><strong>Assists:</strong> ${game.stats.assists}</div>
                        <div><strong>Good Tries:</strong> ${game.stats.goodTry}</div>
                    </div>
                    <div class="card-actions">
                        <button type="button" class="btn-action edit" onclick="openEditModal('${game.id}')">Edit</button>
                        <button type="button" class="btn-action delete" onclick="deleteGame('${game.id}')">Delete</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function deleteGame(id) {
        if (!confirm("Are you sure you want to delete this game?")) return;
       
        let games = JSON.parse(localStorage.getItem('oliviaVolleyballGames') || '[]');
        games = games.filter(g => String(g.id) !== String(id));
        localStorage.setItem('oliviaVolleyballGames', JSON.stringify(games));
        renderHistory();
    }

    function openEditModal(id) {
        const games = JSON.parse(localStorage.getItem('oliviaVolleyballGames') || '[]');
        const game = games.find(g => String(g.id) === String(id));
        if (!game) return;

        document.getElementById('editGameId').value = game.id;
        document.getElementById('editDate').value = game.date;
        document.getElementById('editLocation').value = game.location;

        editStats = { ...game.stats };
        Object.keys(editStats).forEach(key => {
            document.getElementById('edit_' + key).innerText = editStats[key];
        });

        document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    function submitEdit(event) {
        event.preventDefault();
        const id = document.getElementById('editGameId').value;
        let games = JSON.parse(localStorage.getItem('oliviaVolleyballGames') || '[]');

        const index = games.findIndex(g => String(g.id) === String(id));
        if (index !== -1) {
            games[index].date = document.getElementById('editDate').value;
            games[index].location = document.getElementById('editLocation').value.trim();
            games[index].stats = { ...editStats };

            localStorage.setItem('oliviaVolleyballGames', JSON.stringify(games));
            closeEditModal();
            renderHistory();
        }
    }
</script>

</body>
</html>
